<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI, Figtree, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="#000"/>
  <rect width="1200" height="1200" fill="url(#dots)"/>

  <text x="80" y="135" fill="#fff" font-size="66" font-weight="700">Pi Power Button</text>
  <text x="80" y="190" fill="#a5b4fc" font-size="30">One GPIO pin, one relay, the PC's power switch</text>

  <!-- Raspberry Pi Zero W -->
  <rect x="80" y="290" width="440" height="260" rx="22" fill="#0b1220" stroke="#fff" stroke-width="3"/>
  <g fill="#475569">
    <circle cx="112" cy="318" r="6"/><circle cx="132" cy="318" r="6"/><circle cx="152" cy="318" r="6"/><circle cx="172" cy="318" r="6"/><circle cx="192" cy="318" r="6"/>
    <circle cx="212" cy="318" r="6"/><circle cx="232" cy="318" r="6"/><circle cx="252" cy="318" r="6"/><circle cx="272" cy="318" r="6"/><circle cx="292" cy="318" r="6"/>
    <circle cx="312" cy="318" r="6"/><circle cx="332" cy="318" r="6"/><circle cx="352" cy="318" r="6"/><circle cx="372" cy="318" r="6"/><circle cx="392" cy="318" r="6"/>
    <circle cx="412" cy="318" r="6"/><circle cx="432" cy="318" r="6"/><circle cx="452" cy="318" r="6"/><circle cx="472" cy="318" r="6"/><circle cx="492" cy="318" r="6"/>
    <circle cx="112" cy="338" r="6"/><circle cx="132" cy="338" r="6"/><circle cx="152" cy="338" r="6"/><circle cx="172" cy="338" r="6"/><circle cx="192" cy="338" r="6"/>
    <circle cx="212" cy="338" r="6"/><circle cx="232" cy="338" r="6"/><circle cx="272" cy="338" r="6"/><circle cx="292" cy="338" r="6"/>
    <circle cx="312" cy="338" r="6"/><circle cx="332" cy="338" r="6"/><circle cx="352" cy="338" r="6"/><circle cx="372" cy="338" r="6"/><circle cx="392" cy="338" r="6"/>
    <circle cx="412" cy="338" r="6"/><circle cx="432" cy="338" r="6"/><circle cx="452" cy="338" r="6"/><circle cx="472" cy="338" r="6"/><circle cx="492" cy="338" r="6"/>
  </g>
  <!-- physical pin 16 = GPIO 23 -->
  <circle cx="252" cy="338" r="8" fill="#818cf8" stroke="#fff" stroke-width="2"/>
  <text x="110" y="402" fill="#fff" font-size="32" font-weight="700">Raspberry Pi Zero W</text>
  <text x="110" y="436" fill="#94a3b8" font-size="22">password-protected web page</text>
  <text x="496" y="469" fill="#a5b4fc" font-size="21" font-weight="700" text-anchor="end">GPIO 23 (pin 16)</text>
  <text x="496" y="501" fill="#cbd5e1" font-size="21" text-anchor="end">VCC</text>
  <text x="496" y="533" fill="#cbd5e1" font-size="21" text-anchor="end">GND</text>

  <!-- Pi to relay wires -->
  <line x1="520" y1="462" x2="680" y2="462" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="520" y1="494" x2="680" y2="494" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="520" y1="526" x2="680" y2="526" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Relay module -->
  <rect x="680" y="290" width="440" height="260" rx="22" fill="#0b1220" stroke="#fff" stroke-width="3"/>
  <rect x="800" y="318" width="190" height="120" rx="10" fill="#4f46e5"/>
  <text x="895" y="390" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">RELAY</text>
  <text x="702" y="469" fill="#a5b4fc" font-size="21" font-weight="700">IN</text>
  <text x="702" y="501" fill="#cbd5e1" font-size="21">VCC</text>
  <text x="702" y="533" fill="#cbd5e1" font-size="21">GND</text>
  <text x="925" y="482" fill="#64748b" font-size="20" text-anchor="middle">NC</text>
  <text x="995" y="482" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">COM</text>
  <text x="1065" y="482" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">NO</text>
  <rect x="900" y="494" width="50" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="970" y="494" width="50" height="40" rx="6" fill="#1e293b" stroke="#fff" stroke-width="2"/>
  <rect x="1040" y="494" width="50" height="40" rx="6" fill="#1e293b" stroke="#fff" stroke-width="2"/>

  <!-- relay contacts to PWR_SW -->
  <line x1="995" y1="534" x2="995" y2="799" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="1065" y1="534" x2="1065" y2="799" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Motherboard front-panel header -->
  <rect x="680" y="760" width="440" height="250" rx="22" fill="#0b1220" stroke="#fff" stroke-width="3"/>
  <g fill="#334155">
    <rect x="774" y="799" width="22" height="22" rx="3"/><rect x="844" y="799" width="22" height="22" rx="3"/><rect x="914" y="799" width="22" height="22" rx="3"/>
    <rect x="774" y="839" width="22" height="22" rx="3"/><rect x="844" y="839" width="22" height="22" rx="3"/><rect x="914" y="839" width="22" height="22" rx="3"/>
    <rect x="984" y="839" width="22" height="22" rx="3"/><rect x="1054" y="839" width="22" height="22" rx="3"/>
  </g>
  <rect x="984" y="799" width="22" height="22" rx="3" fill="#818cf8" stroke="#fff" stroke-width="2"/>
  <rect x="1054" y="799" width="22" height="22" rx="3" fill="#818cf8" stroke="#fff" stroke-width="2"/>
  <text x="1030" y="900" fill="#a5b4fc" font-size="22" font-weight="700" text-anchor="middle">PWR_SW</text>
  <text x="710" y="955" fill="#fff" font-size="30" font-weight="700">PC motherboard</text>
  <text x="710" y="988" fill="#94a3b8" font-size="22">front-panel header</text>

  <!-- what a press does -->
  <rect x="80" y="760" width="440" height="250" rx="22" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="110" y="828" fill="#fff" font-size="34" font-weight="700">tap 0.4 s</text>
  <text x="110" y="866" fill="#cbd5e1" font-size="25">turn on, or shut down</text>
  <text x="110" y="932" fill="#fff" font-size="34" font-weight="700">hold 6 s</text>
  <text x="110" y="970" fill="#cbd5e1" font-size="25">force off a hung PC</text>

  <text x="600" y="1110" fill="#e2e8f0" font-size="29" text-anchor="middle">Closing the relay shorts PWR_SW, just like the case button.</text>
</svg>
